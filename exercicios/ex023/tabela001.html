<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="pt-br">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;

        }
        

        table{
            width: 400px ;
            height: 400px;
            border-collapse: collapse;
            border: 5px solid black;
        }

        tr.linha{
            background-color: #e4e1e1;
        }

        td{
            border: 1px solid black;
            padding: 8px;
            text-align: center;/*Alinhamneto Horizontal*/
            vertical-align: bottom;/*Alinhamneto Vertical*/
        }
    </style>
</head>
<body>
    <h1>Minha Primeira Tabela</h1>

    <!---
        HIERARQUIA DE TABELAS (simples)

        TABLE = TABELA
            TABLE ROW = Linha de Tabela
                TABLE HEADER = cabeçalho de tabela
                TABLE DATA = dado de tabela
    
    -->
    
    <table>
        <tr><!--Primeira Linha-->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
    
        <tr class="linha"><!--Segunda Linha-->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
    
        <tr><!--Terceira Linha-->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>

        <tr class="linha"><!--Quanrta Linha-->
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
