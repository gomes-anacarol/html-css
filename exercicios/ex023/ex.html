<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinando Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 18px;
            
        }

        h1{
            text-align: center;
        }

        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse;
            border: 5px solid black;
            /*Centralizando Tabela*/
            margin-left: auto;
            margin-right: auto;
        }

        td,th{
            
            border: 1px solid black
        }
        td{
            text-align: center;
            vertical-align: bottom;
        }

        th{
            background-color: rgb(45, 143, 45);
            color: white;
        }

        .linha{
            background-color: rgb(221, 219, 219);
        }
    </style>
</head>
<body>
    <h1>Nova Tabela</h1>
    <table>
        <tr>
            <th>Title 1</th>
            <th>Title 2</th>
            <th>Title 3</th>
            <th>Title 4</th>
        </tr>


        <tr class="linha">
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
            <td>D1</td>
        </tr>

        <tr>
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
            <td>D3</td>
        </tr>

        <tr class="linha">
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
            <td>D3</td>
        </tr>

        <tr>
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
            <td>D4</td>
        </tr>
    </table>
</body>
</html>
